name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish three channels
        working-directory: TYWLauncher-Linux/src
        run: |
          set -e
          for ch in Release Snapshot Beta; do
            dotnet publish TYW.Desktop/TYW.Desktop.csproj \
              -c Release -r linux-x64 --self-contained true \
              -p:TYWChannel=$ch \
              -o "../out/ch-$ch"
          done

      - name: Package tar.gz
        working-directory: TYWLauncher-Linux
        run: |
          set -e
          mkdir -p dist stage
          declare -A NAME=(
            [Release]="TYWLauncher-linux-x64.tar.gz"
            [Snapshot]="TYWLauncher-linux-x64-snapshot.tar.gz"
            [Beta]="TYWLauncher-linux-x64-beta.tar.gz"
          )
          for ch in Release Snapshot Beta; do
            stage="stage/pkg-$ch/tyw-launcher-1.0.0"
            mkdir -p "$stage"
            cp -a "out/ch-$ch/." "$stage/"
            cp packaging/icons/tyw-256.png "$stage/tyw-launcher.png"
            cat > "$stage/tyw-launcher.desktop" <<'EOF'
[Desktop Entry]
Type=Application
Name=TYW Launcher
GenericName=Minecraft Launcher
Exec=tyw-launcher
Icon=tyw-launcher
Categories=Game;
EOF
            cat > "$stage/tyw-launcher" <<'EOF'
#!/bin/sh
HERE="$(dirname "$(readlink -f "$0")")"
exec "$HERE/TYWLauncher" "$@"
EOF
            chmod +x "$stage/tyw-launcher" "$stage/TYWLauncher"
            tar -C "stage/pkg-$ch" -czf "dist/${NAME[$ch]}" tyw-launcher-1.0.0
            rm -rf "stage/pkg-$ch"
          done
          (cd dist && sha256sum TYWLauncher-linux-*.tar.gz > SHA256SUMS-linux-x64.txt)
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TYWLauncher-linux-x64
          path: |
            TYWLauncher-Linux/dist/*.tar.gz
            TYWLauncher-Linux/dist/SHA256SUMS-linux-x64.txt
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TYWLauncher-Linux/dist/TYWLauncher-linux-*.tar.gz
            TYWLauncher-Linux/dist/SHA256SUMS-linux-x64.txt
          generate_release_notes: true
